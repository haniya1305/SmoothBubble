<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulated Tremors - Random Noise</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      cursor: none;
      background-color:lightblue;
    }
    #simulatedCursor {
      width: 10px;
      height: 10px;
      background-color: navy;
      border-radius: 50%;
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    h1 {
      margin-top: 20px;
      color: #333;
      font-size: 2.5rem;
      text-align: center;
    }
    .circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      position: absolute;
    }
    .start {
      background-color: #4caf50;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
    }
    .end {
      background-color: #f44336;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
    }
  </style>
</head>
<body>
  <h1>Simulated Noisy Cursor Movement</h1>
  <div class="circle start"></div>
  <div class="circle end"></div>
  <div id="simulatedCursor"></div>
  <script src="script.js"></script>
</body>
</html>
